global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: incidentflow-backend-blue
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-blue:5000

  - job_name: incidentflow-backend-green
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-green:5000

  - job_name: incidentflow-http-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend-blue:5000/health
          - http://backend-green:5000/health
          - http://proxy/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: incidentflow-tcp-probes
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - backend-blue:5000
          - backend-green:5000
          - proxy:80
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: incidentflow-icmp-probes
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - backend-blue
          - backend-green
          - proxy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
